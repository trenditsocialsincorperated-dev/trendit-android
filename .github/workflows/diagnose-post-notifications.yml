
name: Diagnose Trendit Follow Relationships

on:
  workflow_dispatch:
    inputs:
      account_a_uid:
        description: "Firebase Authentication UID of Account A"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin SDK
        run: npm install --no-save --package-lock=false firebase-admin

      - name: Inspect follow relationships
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ACCOUNT_A_UID: ${{ inputs.account_a_uid }}
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');

          async function main() {
            const credentials = JSON.parse(
              process.env.FIREBASE_SERVICE_ACCOUNT
            );

            initializeApp({ credential: cert(credentials) });

            const db = getFirestore();
            const accountA = process.env.ACCOUNT_A_UID;

            const following = await db
              .collection('users')
              .doc(accountA)
              .collection('following')
              .get();

            console.log(`Account A following documents: ${following.size}`);

            for (const followed of following.docs) {
              const data = followed.data();
              const publisherUid = data.uid || followed.id;

              console.log('--- FOLLOW RELATIONSHIP ---');
              console.log(`Following document fields: ${Object.keys(data).join(', ')}`);

              const reverseFollowers = await db
                .collection('users')
                .doc(publisherUid)
                .collection('followers')
                .get();

              const matches = reverseFollowers.docs.some(doc =>
                doc.id === accountA || doc.data().uid === accountA
              );

              console.log(`Publisher has follower records: ${reverseFollowers.size}`);
              console.log(`Account A exists in publisher followers: ${matches}`);
            }
          }

          main().catch(error => {
            console.error('Diagnostic failed:', error.message);
            process.exit(1);
          });
          NODE
