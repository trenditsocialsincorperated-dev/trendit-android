
name: Diagnose Trendit Post Notifications

on:
  workflow_dispatch:
    inputs:
      account_a_uid:
        description: "Firebase Authentication UID of Account A"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin SDK
        run: npm install --no-save --package-lock=false firebase-admin

      - name: Inspect follower structure
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ACCOUNT_A_UID: ${{ inputs.account_a_uid }}
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');

          async function main() {
            const credentials = JSON.parse(
              process.env.FIREBASE_SERVICE_ACCOUNT
            );

            initializeApp({ credential: cert(credentials) });

            const db = getFirestore();
            const targetUid = process.env.ACCOUNT_A_UID;

            const posts = await db.collection('notifications')
              .where('type', '==', 'post')
              .limit(200)
              .get();

            const publishers = new Set();

            posts.forEach(doc => {
              const senderUid = doc.data().senderUid;
              if (senderUid) publishers.add(senderUid);
            });

            console.log(`Publishers found: ${publishers.size}`);

            const possibleUidFields = [
              'uid',
              'userId',
              'followerUid',
              'followingUid',
              'followerId'
            ];

            for (const publisherUid of publishers) {
              const followers = await db
                .collection('users')
                .doc(publisherUid)
                .collection('followers')
                .get();

              let docIdMatch = false;
              let fieldMatch = false;

              console.log(`Followers collection size: ${followers.size}`);

              for (const follower of followers.docs) {
                const data = follower.data();

                if (follower.id === targetUid) {
                  docIdMatch = true;
                }

                for (const field of possibleUidFields) {
                  if (data[field] === targetUid) {
                    fieldMatch = true;
                  }
                }

                console.log(
                  `Follower document fields: ${Object.keys(data).join(', ') || '(none)'}`
                );
              }

              const followingDoc = await db
                .collection('users')
                .doc(targetUid)
                .collection('following')
                .doc(publisherUid)
                .get();

              console.log('--- RESULTS ---');
              console.log(`Account A matches follower document ID: ${docIdMatch}`);
              console.log(`Account A matches a UID field: ${fieldMatch}`);
              console.log(`Account A has publisher in following: ${followingDoc.exists}`);
            }
          }

          main().catch(error => {
            console.error('Diagnostic failed:', error.message);
            process.exit(1);
          });
          NODE
