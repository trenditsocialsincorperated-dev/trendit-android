
name: Diagnose Trendit Post Notifications

on:
  workflow_dispatch:
    inputs:
      account_a_uid:
        description: "Firebase Authentication UID of Account A"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin SDK
        run: npm install --no-save --package-lock=false firebase-admin

      - name: Check publisher followers
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ACCOUNT_A_UID: ${{ inputs.account_a_uid }}
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');

          async function main() {
            const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

            initializeApp({ credential: cert(credentials) });

            const db = getFirestore();
            const targetUid = process.env.ACCOUNT_A_UID;

            const snapshot = await db.collection('notifications')
              .where('type', '==', 'post')
              .limit(200)
              .get();

            const publishers = new Set();

            snapshot.forEach(doc => {
              const data = doc.data();
              if (data.senderUid) publishers.add(data.senderUid);
            });

            console.log(`Post notifications inspected: ${snapshot.size}`);
            console.log(`Publishers found: ${publishers.size}`);

            let accountAFollowsPublisher = false;

            for (const publisherUid of publishers) {
              const followers = await db
                .collection('users')
                .doc(publisherUid)
                .collection('followers')
                .get();

              const isFollower = followers.docs.some(
                doc => doc.id === targetUid
              );

              console.log('--- Publisher check ---');
              console.log(`Followers found: ${followers.size}`);
              console.log(`Account A is a follower: ${isFollower}`);

              if (isFollower) accountAFollowsPublisher = true;
            }

            console.log('--- FINAL RESULT ---');
            console.log(
              `Account A found in publisher followers: ${accountAFollowsPublisher}`
            );
          }

          main().catch(error => {
            console.error('Diagnostic failed:', error.message);
            process.exit(1);
          });
          NODE
