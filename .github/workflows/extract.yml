name: Extract Trendit Project

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Trendit ZIP
        run: |
          mkdir -p extracted
          unzip -o *.zip -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Move project files to repository root
        run: |
          shopt -s dotglob

          # If the ZIP contains one top-level folder, use its contents.
          dirs=(extracted/*)

          if [ ${#dirs[@]} -eq 1 ] && [ -d "${dirs[0]}" ]; then
            cp -R "${dirs[0]}"/* .
          else
            cp -R extracted/* .
          fi

          rm -rf extracted

      - name: Remove ZIP
        run: |
          rm -f *.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Trendit Android project" || echo "Nothing to commit"
          git push