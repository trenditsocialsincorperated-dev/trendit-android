<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trendit</title>
    <meta name="description" content="Vibrant modern social media platform featuring real-time feeds, stories, reels, polls, direct messaging, and live HD audio & video calling." />
    <meta property="og:title" content="Trendit" />
    <meta property="og:description" content="Vibrant modern social media platform featuring real-time feeds, stories, reels, polls, direct messaging, and live HD audio & video calling." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- PWA & Mobile Native Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090B10" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trendit" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Display + Body + Monospace Fonts (2+1 Rule) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('trendit_theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', isDark ? '#090B10' : '#F8FAFC');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#090B10] dark:text-slate-100 antialiased min-h-screen selection:bg-violet-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
